<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I-N Kitchen & Halal food store — Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --spice: #B54834;
    --spice-dark: #8E3626;
    --turmeric: #E0A94B;
    --cream: #FBF4E9;
    --paper: #FFFFFF;
    --ink: #2A211C;
    --ink-soft: #6B5D53;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #FBF4E9; }

body {
font-family: ‘Manrope’, -apple-system, BlinkMacSystemFont, ‘Segoe UI’, sans-serif;
background: var(–cream);
color: var(–ink);
display: flex;
align-items: center;
justify-content: center;
min-height: 100vh;
padding: 24px 18px;
-webkit-tap-highlight-color: transparent;
}

.card {
width: 100%;
max-width: 400px;
background: var(–paper);
border-radius: 28px;
overflow: hidden;
box-shadow: 0 20px 50px -20px rgba(139, 62, 38, 0.25);
}

.top {
background: linear-gradient(160deg, var(–spice) 0%, var(–spice-dark) 100%);
padding: 36px 28px 30px;
text-align: center;
position: relative;
}

.top::after {
content: ‘’;
position: absolute;
bottom: -1px;
left: 0;
right: 0;
height: 24px;
background: var(–paper);
border-radius: 24px 24px 0 0;
}

.mark {
width: 46px;
height: 46px;
margin: 0 auto 16px;
border: 1.5px solid rgba(255,255,255,0.55);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
}

.mark svg { width: 22px; height: 22px; }

.top h1 {
font-family: ‘Fraunces’, Georgia, serif;
font-weight: 600;
font-size: 22px;
color: #FFF8EF;
line-height: 1.3;
}

.top p {
color: rgba(255, 248, 239, 0.75);
font-size: 13.5px;
margin-top: 6px;
}

.body {
padding: 34px 28px 32px;
text-align: center;
}

.prompt {
font-family: ‘Fraunces’, Georgia, serif;
font-size: 19px;
font-weight: 500;
line-height: 1.45;
color: var(–ink);
margin-bottom: 10px;
}

.prompt .accent { color: var(–spice); }

.hint {
font-size: 13px;
color: var(–ink-soft);
line-height: 1.55;
margin-bottom: 24px;
background: var(–cream);
border-radius: 12px;
padding: 12px 14px;
text-align: left;
}

.hint strong { color: var(–ink); }

.cta {
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
width: 100%;
padding: 17px 20px;
background: var(–spice);
color: #FFF8EF;
border: none;
border-radius: 14px;
font-family: ‘Manrope’, sans-serif;
font-size: 16px;
font-weight: 700;
text-decoration: none;
transition: transform 0.15s ease, background 0.15s ease;
cursor: pointer;
}

.cta:active {
transform: scale(0.97);
background: var(–spice-dark);
}

.cta svg { width: 20px; height: 20px; flex-shrink: 0; }

.status {
font-size: 12.5px;
color: var(–spice-dark);
margin-top: 14px;
min-height: 16px;
font-weight: 600;
}

.stars {
display: flex;
justify-content: center;
gap: 5px;
margin-top: 22px;
}

.stars svg { width: 17px; height: 17px; fill: var(–turmeric); }

.foot { text-align: center; padding: 4px 20px 26px; }

.foot p {
font-size: 11.5px;
color: var(–ink-soft);
line-height: 1.6;
}
</style>

</head>
<body>

  </div>

  <script>
    var REVIEW_URL = "https://search.google.com/local/writereview?placeid=ChIJuZ1yuh0RIWARkkoEJ2nr8Y8";
    var REVIEW_TEXT = "Great food and service";

    var btn = document.getElementById('reviewBtn');
    var status = document.getElementById('status');

    btn.addEventListener('click', async function() {
      try {
        await navigator.clipboard.writeText(REVIEW_TEXT);
        status.textContent = "Copied! Opening Google review…";
      } catch (err) {
        // Clipboard may fail on some browsers without user gesture context or permissions
        status.textContent = "Opening Google review…";
      }
      setTimeout(function() {
        window.location.href = REVIEW_URL;
      }, 400);
    });
  </script>

</body>
</html>
