<style>
  html *, body * { box-sizing: border-box; margin: 0; padding: 0; }

body {

.card {
width: 100%;
max-width: 400px;
background: #FFFFFF;
border-radius: 28px;
overflow: hidden;
box-shadow: 0 20px 50px -20px rgba(139, 62, 38, 0.25);
}

.top {
background: linear-gradient(160deg, #B54834 0%, #8E3626 100%);
padding: 36px 28px 30px;
text-align: center;
position: relative;
}

.top::after {
content: ‘’;
position: absolute;
bottom: -1px;
left: 0;
right: 0;
height: 24px;
background: #FFFFFF;
border-radius: 24px 24px 0 0;
}

.mark {
width: 46px;
height: 46px;
margin: 0 auto 16px;
border: 1.5px solid rgba(255,255,255,0.55);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
}

.mark svg { width: 22px; height: 22px; }

.top h1 {
font-family: ‘Fraunces’, Georgia, serif;
font-weight: 600;
font-size: 22px;
color: #FFF8EF;
line-height: 1.3;
}

.top p {
color: rgba(255, 248, 239, 0.75);
font-size: 13.5px;
margin-top: 6px;
}

.body {
padding: 34px 28px 32px;
text-align: center;
}

.prompt {
font-family: ‘Fraunces’, Georgia, serif;
font-size: 19px;
font-weight: 500;
line-height: 1.45;
color: #2A211C;
margin-bottom: 10px;
}

.prompt .accent { color: #B54834; }

.prompt .jp,
.hint .jp {
display: block;
font-family: ‘Manrope’, sans-serif;
font-weight: 500;
}

.prompt .jp {
font-size: 14px;
color: #6B5D53;
margin-top: 4px;
}

.hint .jp {
font-size: 12px;
margin-top: 3px;
opacity: 0.85;
}

.hint {
font-size: 13px;
color: #6B5D53;
line-height: 1.55;
margin-bottom: 24px;
background: #FBF4E9;
border-radius: 12px;
padding: 12px 14px;
text-align: left;
}

.hint strong { color: #2A211C; }

.options {
display: flex;
flex-direction: column;
gap: 9px;
margin-bottom: 18px;
}

.opt {
width: 100%;
text-align: left;
padding: 13px 16px;
background: #FFFFFF;
color: #2A211C;
border: 1.5px solid #EBDFCF;
border-radius: 13px;
font-family: ‘Manrope’, sans-serif;
font-size: 14px;
line-height: 1.5;
font-weight: 600;
cursor: pointer;
transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
}

.opt:active {
transform: scale(0.98);
background: #FBF4E9;
border-color: #B54834;
}

.google-cta {
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
padding-top: 4px;
}

.google-cta span {
font-size: 12.5px;
color: #6B5D53;
font-weight: 600;
}

.status {
font-size: 12.5px;
color: #8E3626;
margin-top: 14px;
min-height: 16px;
font-weight: 600;
}

.stars {
display: flex;
justify-content: center;
gap: 5px;
margin-top: 22px;
}

.stars svg { width: 17px; height: 17px; fill: #E0A94B; }

.foot { text-align: center; padding: 4px 20px 26px; }

.foot p {
font-size: 11.5px;
color: #6B5D53;
line-height: 1.6;
}
</style>

</head>

  </div>

  <script>
    var REVIEW_URL = "https://search.google.com/local/writereview?placeid=ChIJuZ1yuh0RIWARkkoEJ2nr8Y8";

    var opts = document.querySelectorAll('.opt');
    var status = document.getElementById('status');

    opts.forEach(function(opt) {
      opt.addEventListener('click', async function() {
        var text = opt.getAttribute('data-text');
        try {
          await navigator.clipboard.writeText(text);
          status.textContent = "Copied! Opening Google review…";
        } catch (err) {
          status.textContent = "Opening Google review…";
        }
        setTimeout(function() {
          window.location.href = REVIEW_URL;
        }, 400);
      });
    });
  </script>
